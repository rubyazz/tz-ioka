[project]
name = "tz-ioka"
version = "1.0.0"
description = "Avia tickets booking service (search, booking, issuing, PDF tickets) — production-grade test assignment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "aio-pika>=10.0,<11",
    "PyJWT>=2.10",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "orjson>=3.10",
    "reportlab>=4.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "C4",               # comprehensions
    "RUF",              # ruff-specific
]
ignore = [
    "B008",  # FastAPI DI uses function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations legitimately contain long DDL lines
"alembic/versions/*" = ["E501", "W291"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
